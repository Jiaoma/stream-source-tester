name: virtual-camera-rtsp
server:
  rtspPort: 8554
inputs:
  - name: local-input
    kind: mp4
    codec: h264
    location: ./fixtures/sample.mp4
outputs:
  - name: camera-rtsp
    kind: rtsp
    target: rtsp://127.0.0.1:8554/camera
    options:
      auth.mode: basic
      auth.username: admin
      auth.password: secret
      auth.realm: virtual-camera
      camera.vendor: stream-source-tester
      camera.model: virtual-cam-1
mutations:
  - name: passthrough
    kind: identity
    enabled: true
profiles:
  - name: camera
    input: local-input
    output: camera-rtsp
    mutations: [passthrough]
