name: my-virtual-pcap
server:
  rtspPort: 8557
inputs:
  - name: camera-pcap-input
    kind: pcap
    codec: h264
    location: ./fixtures/rtsp_capture.pcap
outputs:
  - name: camera-pcap-rtsp
    kind: rtsp
    target: rtsp://127.0.0.1:8557/camera
    options:
      auth.mode: basic
      auth.username: camera
      auth.password: secret
      auth.realm: pcap-replay-camera
mutations:
  - name: passthrough
    kind: identity
    enabled: true
profiles:
  - name: pcap-camera
    input: camera-pcap-input
    output: camera-pcap-rtsp
    mutations: [passthrough]
